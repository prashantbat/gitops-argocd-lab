apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gitops-demo-prod
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/prashantbat/gitops-argocd-lab.git
    targetRevision: main
    path: apps/gitops-demo/overlays/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: gitops-demo-prod
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
